[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "london-flat-atlas-api"
version = "0.1.0"
description = "FastAPI backend for London Flat Atlas data entitlements and billing."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "pydantic-settings>=2.12,<3",
    "PyJWT[crypto]==2.13.0",
    "SQLAlchemy==2.0.51",
    "stripe==15.3.1",
    "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
test = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
